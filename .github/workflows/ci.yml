# Continuous integration: on every pull request to main (and every push to
# main), check the code and the Docker image on a fresh GitHub machine.
#
#   test    lint with ruff, run the unit tests with pytest
#   docker  build the image and check that the server starts inside it
#
# No documents, database contents or secrets are needed: tests use made-up
# text and fakes, and the image never contains data.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # also allows starting a run by hand from the Actions tab

# Only read access to the repository: this workflow never changes anything.
permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true # reuse downloaded packages between runs
          cache-dependency-glob: uv.lock

      - name: Install dependencies (exactly as in uv.lock)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -v

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: test # don't spend minutes building an image for code that fails its tests
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: tfm-chatbot:ci
          load: true # keep the image on this machine so the next step can run it
          push: false # never published from here
          cache-from: type=gha # reuse layers from previous runs (GitHub's cache)
          cache-to: type=gha,mode=max

      - name: Start the container and wait for the server
        run: |
          docker run -d --name app -p 8000:8000 tfm-chatbot:ci
          # No database or Ollama here, so /health should answer 503 ("degraded").
          # Any answer proves the image starts: Python, libraries, embedding model
          # (loaded offline from the image) and the web server all work.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Server answered /health with HTTP $code after ~$((i * 2)) s"
              curl -s http://127.0.0.1:8000/health; echo
              exit 0
            fi
            sleep 2
          done
          echo "The server did not answer within 120 s"
          exit 1

      - name: Show the container logs if something failed
        if: failure()
        run: docker logs app