# The whole app: database + web app. Embeddings (Cloudflare) and the LLM (Groq)
# are hosted APIs, configured in .env.
#
#   docker compose up -d --build   build the app image and start both services
#   docker compose up -d db        only the database (for local development)
#   docker compose down            stop and remove the containers (data is kept)
#
# Values like ${POSTGRES_USER} are read from .env.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: tfm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # so scripts on your PC (ingestion, evals) can reach it
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Is Postgres accepting connections?" ($$ = a literal $ for the shell inside)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: tfm-chatbot
    container_name: tfm-app
    env_file: .env # LLM_*, EMBEDDING_MODEL, ... (secrets enter at run time, not in the image)
    environment:
      # Overrides .env: inside a container, 127.0.0.1 is the container itself.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8080:8000" # your PC's port 8080 -> the container's port 8000
    depends_on:
      db:
        condition: service_healthy # start only once Postgres is ready
    healthcheck:
      # Calls the app's own /health endpoint; fails on 503 (database or an API down).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s # time to start before failed checks count
    restart: unless-stopped

volumes:
  pgdata: